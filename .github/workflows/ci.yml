name: ci

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sla_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sla_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/sla_platform
      DATABASE_URL: postgres://app_user:app_user_pw@localhost:5432/sla_platform
      JWT_ACCESS_SECRET: ci-access-secret-0123456789
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789
      RUN_DB_TESTS: '1'
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Migration
        run: npm run migrate
      - name: RLS entegrasyon testleri
        run: npm run test:db
